<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shibili Nuhman — Graphic Designer</title>
<link rel="preload" href="fonts/inter-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==========  SCROLL-DRIVEN HERO  ========== -->
  <section class="reveal" id="reveal">
    <div class="reveal__stage">

      <div class="card" id="card">
        <p class="line">
          <span class="w" data-w>Hi,</span>
          <span class="w" data-w>I&rsquo;m</span>
        </p>

        <p class="line">
          <span class="w" data-w>Shibili</span>
          <span class="w" data-w>Nuhman</span>
          <span class="w badge-w" data-w><span class="badge">GRAPHIC DESIGNER</span></span>
        </p>

        <p class="line">
          <span class="w" data-w>on</span>
          <span class="w" data-w>screen.</span>
          <span class="w" data-w>on</span>
          <span class="w" data-w>paper.</span>
          <span class="w" data-w>in</span>
          <span class="w" data-w>streets.</span>
        </p>

        <p class="line">
          <span class="w" data-w>I</span>
          <span class="w" data-w>really</span>
          <span class="w" data-w>love</span>
          <span class="w" data-w>to</span>
          <span class="w" data-w>make</span>
          <span class="w" data-w>the</span>
          <span class="w" data-w>brands</span>
        </p>

        <p class="line">
          <span class="w move" data-w id="move"
            >m<span class="move__o" id="moveO">o</span><span class="move__stretch" id="moveStretch" aria-hidden="true"></span>ve.</span>
        </p>
      </div>

    </div>
  </section>

  <script src="hero.js"></script>
</body>
</html>
